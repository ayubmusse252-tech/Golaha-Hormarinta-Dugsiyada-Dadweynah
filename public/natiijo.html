<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Natiijada Ardayga</title>
<style>
  :root{--bg:#f4f5f7;--surface:#fff;--surface2:#eef0f3;--border:#d9dce2;--text:#1b1f27;--dim:#5c6370;--accent:#1e4fa3;--good:#1e8e5a;--bad:#c0392b;--radius:12px;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{max-width:560px;margin:0 auto;padding:18px 14px 60px;}
  h1{font-size:1.2rem;margin:6px 0 2px;text-align:center;}
  .sub{color:var(--dim);font-size:.85rem;text-align:center;margin:0 0 16px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  label{display:block;font-size:.85rem;font-weight:600;margin:0 0 6px;}
  input{width:100%;padding:12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);font-size:1rem;font-family:inherit;}
  button{cursor:pointer;border:none;border-radius:9px;font-weight:700;font-size:.95rem;padding:12px 16px;background:var(--accent);color:#fff;width:100%;margin-top:12px;}
  button:disabled{opacity:.6;cursor:default;}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
  .err{color:var(--bad);font-size:.88rem;margin-top:10px;}
  .hidden{display:none !important;}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;}
  .kpi{background:var(--surface2);border-radius:10px;padding:10px 4px;text-align:center;}
  .kpi b{display:block;font-size:1.2rem;color:var(--accent);} .kpi span{font-size:.72rem;color:var(--dim);}
  table{width:100%;border-collapse:collapse;font-size:.86rem;}
  th,td{border-bottom:1px solid var(--border);padding:7px 4px;text-align:center;}
  th{font-size:.74rem;color:var(--dim);} td.l,th.l{text-align:start;}
  .good{color:var(--good);font-weight:700;} .bad{color:var(--bad);font-weight:700;}
  .support{background:#fdf1ef;border:1px solid #f0c9c3;border-radius:10px;padding:12px;font-size:.9rem;line-height:1.55;margin-top:12px;}
  .ok{background:#eef8f2;border:1px solid #c5e5d1;border-radius:10px;padding:12px;font-size:.9rem;margin-top:12px;}
  @media print{.no-print{display:none !important;} body{background:#fff;}}
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 Natiijada Ardayga</h1>
  <p class="sub">Golaha Horumarinta Dugsiyada Dadweynaha (GHDD)<br><span id="rn"></span></p>

  <div class="card no-print" id="formCard">
    <label for="sid">Geli ID-gaaga (ID-ga ardayga)</label>
    <input id="sid" type="text" inputmode="text" autocomplete="off" placeholder="tusaale: 1001">
    <button id="go" type="button">🔍 Arag Natiijadayda</button>
    <div class="err hidden" id="err"></div>
  </div>

  <div id="out" class="hidden"></div>
</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const token=(location.pathname.match(/\/n\/([^\/?#]+)/)||[])[1]||"";
  const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
  const f1=x=>x==null?"–":String(Math.round(x*10)/10);
  const gcol=g=>({A:"#1e8e5a",B:"#4aa56b",C:"#f2a900",D:"#e08a2e",F:"#c0392b"})[g]||"#333";
  function showErr(m){const e=$("err");e.textContent=m;e.classList.remove("hidden");}

  fetch("/api/public/result-info/"+encodeURIComponent(token)).then(async r=>{
    const j=await r.json().catch(()=>({}));
    if(!r.ok){$("formCard").classList.add("hidden");$("out").classList.remove("hidden");$("out").innerHTML='<div class="card err">'+esc(j.error||"Link-gan ma shaqeynayo.")+'</div>';return;}
    $("rn").textContent=j.name||"";
  }).catch(()=>{});

  async function go(){
    const id=$("sid").value.trim();$("err").classList.add("hidden");
    if(!id)return showErr("Fadlan geli ID-gaaga.");
    $("go").disabled=true;$("go").textContent="⏳ Waa la raadinayaa...";
    try{
      const r=await fetch("/api/public/result",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,id})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(j.error||"Khalad ayaa dhacay.");
      render(j);
    }catch(e){showErr(e.message);}
    $("go").disabled=false;$("go").textContent="🔍 Arag Natiijadayda";
  }

  const sg=(v,p)=>{v=Number(v);return isNaN(v)?"":v>=80?"A":v>=70?"B":v>=60?"C":v>=p?"D":"F";};
  function render(d){
    const need=d.subjects.filter(x=>x.needsSupport);
    $("out").classList.remove("hidden");
    $("out").innerHTML=
      `<div class="card"><h2 style="margin:0 0 2px;font-size:1.1rem">${esc(d.name)}</h2><div class="sub" style="text-align:start;margin:0">ID: ${esc(d.id)}</div>
      <div class="kpis"><div class="kpi"><b>${esc(d.total)}</b><span>Wadarta</span></div><div class="kpi"><b>${f1(d.avg)}</b><span>Celcelis</span></div><div class="kpi"><b style="color:${gcol(d.grade)}">${esc(d.grade)}</b><span>Heer</span></div></div>
      <div class="sub" style="margin:0 0 10px">Booskaaga fasalka: <b>${d.rank}</b> / ${d.of}</div>
      <table><tr><th class="l">Maaddada</th><th>Dhibcaha</th><th>Heerka</th><th></th></tr>`+
      d.subjects.map(x=>`<tr><td class="l">${esc(x.subject)}</td><td class="${x.needsSupport?"bad":"good"}">${esc(x.score)}</td><td style="font-weight:700;color:${gcol(sg(x.score,d.pass))}">${sg(x.score,d.pass)}</td><td>${x.needsSupport?"⚠️":"✅"}</td></tr>`).join("")+`</table>`+
      (need.length?`<div class="support"><b>Maaddooyinka aad u baahan tahay taageero (ka hooseeya ${d.pass}%):</b><br>${need.map(x=>`• ${esc(x.subject)} (<span class="bad">${esc(x.score)}</span>)`).join("<br>")}<br><i>Fadlan la xariir xafiiska Maamulka si lagu siiyo taageero.</i></div>`:`<div class="ok">🎉 Hambalyo! Dhammaan maaddooyinka waad ka gudubtay ${d.pass}%.</div>`)+
      `</div><div class="no-print"><button class="btn-ghost" id="pr" type="button">🖨️ Daabac / Save PDF</button><button class="btn-ghost" id="again" type="button">↩️ ID kale</button></div>`;
    $("formCard").classList.add("hidden");
    $("pr").addEventListener("click",()=>window.print());
    $("again").addEventListener("click",()=>{$("out").classList.add("hidden");$("out").innerHTML="";$("formCard").classList.remove("hidden");$("sid").value="";$("sid").focus();});
    window.scrollTo(0,0);
  }
  $("go").addEventListener("click",go);
  $("sid").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
})();
</script>
</body>
</html>
